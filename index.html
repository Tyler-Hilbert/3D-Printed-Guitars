<!DOCTYPE html>
<!-- Vibe coded webpage to display HuggingFace dataset of 3D printable guitar models -->
<html>
<head>
  <title>3D Printable Guitars</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    th { background: #f0f0f0; }
    tr:hover { background: #f9f9f9; }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <h1>3D Printed Guitar Models</h1>
  <p>These are the printable guitar models with the most likes.</p>
  <table id="table">
    <tr>
        <th>Name</th>
        <th>Bridge Pickup</th>
        <th>Middle Pickup</th>
        <th>Neck Pickup</th>
        <th>Likes</th>
        <th></th>
    </tr>
  </table>
  <script>
    ////////////////////////////////////////////////////////////////////////////
    // GENERATED BY CLAUDE
    fetch("https://huggingface.co/datasets/TylerHilbert/3D-Printable-Guitar-Models/resolve/main/guitar_models.csv")
      .then(r => r.text())
      .then(csv => {
        const data = parseCSV(csv);
        const table = document.getElementById("table");
        data.forEach(item => {
          table.innerHTML += `<tr>
            <td>${item.name || ""}</td>
            <td>${item.pickup_bridge || ""}</td>
            <td>${item.pickup_middle || ""}</td>
            <td>${item.pickup_neck || ""}</td>
            <td>${item.likes || ""}</td>
            <td><a href="${item.link}" target="_blank">Link</a></td>
          </tr>`;
        });
      });

    // Minimal CSV parser: handles quoted fields, embedded commas, and escaped quotes ("")
    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') { inQuotes = false; }
          else { field += c; }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === ',') { row.push(field); field = ""; }
          else if (c === '\n' || c === '\r') {
            if (field !== "" || row.length) { row.push(field); rows.push(row); row = []; field = ""; }
            if (c === '\r' && text[i + 1] === '\n') i++;
          } else { field += c; }
        }
      }
      if (field !== "" || row.length) { row.push(field); rows.push(row); }

      const headers = rows.shift().map(h => h.toLowerCase());
      return rows.map(r => Object.fromEntries(headers.map((h, i) => [h, r[i]])));
    }
    // END OF SECTION GENERATED BY CLAUDE
    ////////////////////////////////////////////////////////////////////////////
  </script>
  <p>Reference: <a href="https://huggingface.co/datasets/TylerHilbert/3D-Printable-Guitar-Models">https://huggingface.co/datasets/TylerHilbert/3D-Printable-Guitar-Models</a></p>
</body>
</html>
